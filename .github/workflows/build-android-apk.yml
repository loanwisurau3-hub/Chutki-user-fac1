name: Build Chutki Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK Type (debug = instant test, release = signed)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK 21 (Required for Capacitor 8 Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/android@^8.0.0 @capacitor/cli@^8.0.0 --no-save --legacy-peer-deps

      - name: Build Web App (Vite)
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Setup Capacitor Android Project & Firebase
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Add Android Permissions (GPS, Notifications, Mic, Vibrate)
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
              "android.permission.RECORD_AUDIO"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace(
                  "<uses-permission android:name=\"android.permission.INTERNET\" />",
                  `<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="${p}" />`
                );
              }
            }
            fs.writeFileSync(manifestPath, xml, "utf8");
          '

      - name: Sync Capacitor Assets & Plugins
        run: npx cap sync android

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: Chutki-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Release APK (Unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Signed Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: Chutki-Release-APK
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
